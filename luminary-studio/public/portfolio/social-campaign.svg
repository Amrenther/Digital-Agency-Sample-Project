<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Glowing orbs -->
  <circle cx="200" cy="200" r="150" fill="#22d3ee" opacity="0.08"/>
  <circle cx="600" cy="400" r="180" fill="#a855f7" opacity="0.1"/>

  <!-- Phone frames -->
  <rect x="80" y="80" width="180" height="320" rx="20" fill="#111827" stroke="url(#g1)" stroke-width="2"/>
  <rect x="90" y="100" width="160" height="260" rx="8" fill="url(#g1)" opacity="0.15"/>
  <rect x="100" y="120" width="140" height="80" rx="6" fill="url(#g1)" opacity="0.4"/>
  <rect x="100" y="215" width="100" height="10" rx="5" fill="white" opacity="0.5"/>
  <rect x="100" y="233" width="70" height="8" rx="4" fill="white" opacity="0.3"/>

  <rect x="310" y="120" width="180" height="320" rx="20" fill="#111827" stroke="url(#g2)" stroke-width="2"/>
  <rect x="320" y="140" width="160" height="260" rx="8" fill="url(#g2)" opacity="0.15"/>
  <rect x="330" y="160" width="140" height="80" rx="6" fill="url(#g2)" opacity="0.4"/>
  <rect x="330" y="255" width="100" height="10" rx="5" fill="white" opacity="0.5"/>
  <rect x="330" y="273" width="70" height="8" rx="4" fill="white" opacity="0.3"/>

  <rect x="540" y="80" width="180" height="320" rx="20" fill="#111827" stroke="url(#g1)" stroke-width="2"/>
  <rect x="550" y="100" width="160" height="260" rx="8" fill="url(#g1)" opacity="0.15"/>
  <rect x="560" y="120" width="140" height="80" rx="6" fill="url(#g2)" opacity="0.4"/>
  <rect x="560" y="215" width="100" height="10" rx="5" fill="white" opacity="0.5"/>
  <rect x="560" y="233" width="70" height="8" rx="4" fill="white" opacity="0.3"/>

  <!-- Bottom text -->
  <text x="400" y="470" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#g1)" text-anchor="middle" filter="url(#glow)">Bloom Social Campaign</text>
  <text x="400" y="505" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.5" text-anchor="middle">Digital Marketing · Social Media · Content</text>

  <!-- Decorative dots -->
  <circle cx="150" cy="450" r="4" fill="#22d3ee" opacity="0.6"/>
  <circle cx="170" cy="440" r="3" fill="#a855f7" opacity="0.5"/>
  <circle cx="630" cy="460" r="4" fill="#a855f7" opacity="0.6"/>
  <circle cx="650" cy="450" r="3" fill="#22d3ee" opacity="0.5"/>
</svg>
